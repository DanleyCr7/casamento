name: Deploy invitations to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

# Every run publishes the complete site. Keep an active deployment running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.result }}
      origin: ${{ steps.sources.outputs.origin }}
    steps:
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Resolve invitation versions
        id: sources
        uses: actions/github-script@v7
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        with:
          script: |
            const basePath = process.env.PAGES_BASE_PATH;
            const origin = process.env.PAGES_ORIGIN.replace(/^http:/, 'https:');
            core.setOutput('origin', origin);
            const include = [{ branch: 'main', sha: context.sha, basePath }];
            for (const branch of ['casamento', 'melinda', 'perola']) {
              const { data } = await github.rest.git.getRef({
                ...context.repo,
                ref: `heads/${branch}`,
              });
              include.push({ branch, sha: data.object.sha, basePath: `${basePath}/${branch}` });
            }
            await core.summary
              .addHeading('Convites desta publicação')
              .addTable([
                [{ data: 'Branch', header: true }, { data: 'Commit', header: true }, { data: 'Endereço', header: true }],
                ...include.map(({ branch, sha, basePath }) => [branch, sha, `${origin}${basePath}/`]),
              ])
              .write();
            return { include };

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      NEXT_PUBLIC_BASE_PATH: ${{ matrix.basePath }}
      NEXT_PUBLIC_SITE_URL: ${{ needs.prepare.outputs.origin }}
    steps:
      - name: Checkout invitation
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Static analysis
        run: npm run lint
      - name: Export invitation
        run: npm run build
      - name: Save invitation
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.branch }}
          path: out/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download invitations
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: artifacts
      - name: Assemble complete site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a artifacts/site-main/. _site/
          for invitation in casamento melinda perola; do
            mkdir -p "_site/$invitation"
            cp -a "artifacts/site-$invitation/." "_site/$invitation/"
          done
          touch _site/.nojekyll
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
