name: Publish updated invitation

on:
  push:
    branches: [casamento, melinda, perola]

permissions:
  actions: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch can start another run using GITHUB_TOKEN.
      # Deployment stays on main, as required by the Pages environment.
      - name: Request complete publication from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run nextjs.yml --ref main
